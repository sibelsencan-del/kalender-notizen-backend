<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <title>Kalender & Notizen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #e0e0e0;
            background: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-weight: 500;
            transition: all 0.3s;
            color: #666;
        }

        .tab.active {
            color: #6366f1;
            border-bottom-color: #6366f1;
        }

        .tab:hover {
            background: #f9f9f9;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .calendar-header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-header h2 {
            font-size: 20px;
            color: #333;
        }

        .nav-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s;
        }

        .nav-btn:hover {
            background: #4f46e5;
        }

        .day-label {
            text-align: center;
            font-weight: 600;
            color: #666;
            padding: 8px 0;
        }

        .day {
            aspect-ratio: 1;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            background: white;
            font-size: 12px;
        }

        .day:hover {
            border-color: #6366f1;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.1);
        }

        .day.selected {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        .day.has-event::after {
            content: '●';
            color: #f59e0b;
            font-size: 16px;
            position: absolute;
            bottom: 4px;
            right: 4px;
        }

        .day-number {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .event-item {
            font-size: 10px;
            background: rgba(99, 102, 241, 0.1);
            padding: 2px 4px;
            border-radius: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .week-view {
            display: none;
        }

        .week-view.active {
            display: block;
        }

        .week-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }

        .week-day {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #6366f1;
        }

        .week-day-header {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .week-event {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            font-size: 13px;
            border-left: 3px solid #f59e0b;
        }

        .week-event.no-events {
            color: #999;
            font-style: italic;
        }

        .week-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .week-nav h3 {
            flex: 1;
            min-width: 200px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input, select {
            flex: 1;
            min-width: 150px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s;
        }

        button:hover {
            background: #4f46e5;
        }

        button.secondary {
            background: #6b7280;
        }

        button.secondary:hover {
            background: #4b5563;
        }

        .item {
            background: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border-left: 4px solid #6366f1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .item.done {
            opacity: 0.6;
            background: #f0fdf4;
        }

        .item-text {
            flex: 1;
            word-break: break-word;
        }

        .item.done .item-text {
            text-decoration: line-through;
            color: #999;
        }

        .item-actions {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-small:hover {
            background: #4f46e5;
        }

        .btn-delete {
            background: #ef4444;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .voice-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #6366f1;
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 0;
        }

        .voice-btn:hover {
            background: #4f46e5;
            transform: scale(1.05);
        }

        .voice-btn.recording {
            background: #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px;
            border-radius: 6px;
            z-index: 2000;
            animation: slideUp 0.3s ease;
            max-width: 400px;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #6366f1;
            margin-right: 10px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 22px;
            }

            .calendar {
                gap: 4px;
            }

            .day {
                font-size: 10px;
                padding: 4px;
            }

            .tab {
                font-size: 12px;
            }

            input, select {
                min-width: 100px;
            }
        }

        .settings-grid {
            display: grid;
            gap: 15px;
        }

        .setting-group {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #6366f1;
        }

        .setting-group h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .setting-group button {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Kalender & Notizen</h1>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="showTab('kalender')">Kalender</div>
            <div class="tab" onclick="showTab('woche')">Woche</div>
            <div class="tab" onclick="showTab('notizen')">Notizen</div>
            <div class="tab" onclick="showTab('einstellungen')">⚙️</div>
        </div>

        <div class="content">
            <!-- KALENDER TAB -->
            <div id="kalender" class="tab-content active">
                <div class="input-group">
                    <input type="text" id="eventTitle" placeholder="Termin (z.B. Zahnarzt)">
                    <input type="time" id="eventTime" placeholder="Zeit">
                    <button onclick="addEvent()">+ Termin</button>
                </div>

                <div class="calendar-header">
                    <button class="nav-btn" onclick="prevMonth()">← Zurück</button>
                    <h2 id="monthYear"></h2>
                    <button class="nav-btn" onclick="nextMonth()">Weiter →</button>
                </div>

                <div id="calendar" class="calendar"></div>

                <div id="dayEvents" style="margin-top: 20px;">
                    <h3 style="margin-bottom: 10px; color: #333;">Termine für <span id="selectedDateDisplay">heute</span></h3>
                    <div id="eventsList"></div>
                </div>
            </div>

            <!-- WOCHE TAB -->
            <div id="woche" class="tab-content">
                <div class="week-nav">
                    <button class="nav-btn" onclick="prevWeek()">← Vorherige Woche</button>
                    <h3 id="weekHeader"></h3>
                    <button class="nav-btn" onclick="nextWeek()">Nächste Woche →</button>
                </div>
                <div id="weekView" class="week-grid"></div>
            </div>

            <!-- NOTIZEN TAB -->
            <div id="notizen" class="tab-content">
                <div class="input-group">
                    <input type="text" id="noteInput" placeholder="Notiz eingeben..." onkeypress="if(event.key==='Enter') addNote()">
                    <button id="voiceBtn" class="voice-btn" onclick="toggleVoice()" title="Mikrofon">🎤</button>
                </div>

                <div id="notesList"></div>
            </div>

            <!-- EINSTELLUNGEN TAB -->
            <div id="einstellungen" class="tab-content">
                <div class="settings-grid">
                    <div class="setting-group">
                        <h3>💾 Daten</h3>
                        <button onclick="exportJSON()">JSON exportieren</button>
                        <button class="secondary" onclick="exportCSV()" style="margin-top: 8px;">CSV exportieren</button>
                    </div>

                    <div class="setting-group">
                        <h3>🔄 Zurücksetzen</h3>
                        <button class="secondary" onclick="resetAll()">Alle Daten löschen</button>
                    </div>

                    <div class="setting-group">
                        <h3>ℹ️ Info</h3>
                        <p style="font-size: 13px; color: #666; margin: 10px 0;">
                            Kalender & Notizen v2.0<br>
                            Spracherkennung: Web Speech API (kostenloses Fallback) + AssemblyAI<br>
                            KI-Verarbeitung: Claude API
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Notiz bearbeiten</div>
            <input type="text" id="modalNoteText" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px;">
            <div class="modal-actions">
                <button class="secondary" onclick="closeModal()">Abbrechen</button>
                <button onclick="saveModalNote()">Speichern</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIG
        const ASSEMBLY_AI_TOKEN = '60ceae17ec34415088596d2e6feedcd8';
        const VERCEL_URL = 'https://kalender-notizen-backend-r30in84p8-sibel1.vercel.app/api/process';
        const STORAGE_KEY = 'kalender-v3';

        let currentDate = new Date();
        let selectedDate = new Date();
        let weekStart = getMonday(new Date());
        let recognitionActive = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let editingNoteId = null;

        // STATE
        let appState = {
            currentDate: new Date().toISOString().split('T')[0],
            selectedDate: new Date().toISOString().split('T')[0],
            weekStart: getMonday(new Date()).toISOString().split('T')[0],
            events: [],
            notes: []
        };

        // INIT
        function init() {
            loadState();
            renderCalendar();
            renderNotes();
            renderWeekEvents();
        }

        // STORAGE
        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                appState = JSON.parse(saved);
                currentDate = new Date(appState.currentDate);
                selectedDate = new Date(appState.selectedDate);
                weekStart = new Date(appState.weekStart);
            }
        }

        function saveState() {
            appState.currentDate = currentDate.toISOString().split('T')[0];
            appState.selectedDate = selectedDate.toISOString().split('T')[0];
            appState.weekStart = weekStart.toISOString().split('T')[0];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }

        // CALENDAR
        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());

            document.getElementById('monthYear').textContent = `${firstDay.toLocaleDateString('de-DE', {month: 'long', year: 'numeric'})}`;

            const cal = document.getElementById('calendar');
            cal.innerHTML = '';

            const dayLabels = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
            dayLabels.forEach(label => {
                const dayLabel = document.createElement('div');
                dayLabel.className = 'day-label';
                dayLabel.textContent = label;
                cal.appendChild(dayLabel);
            });

            let date = new Date(startDate);
            for (let i = 0; i < 42; i++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'day';

                if (date.getMonth() === month) {
                    const dateStr = formatDate(date);
                    const eventsForDay = appState.events.filter(e => e.date === dateStr);

                    dayEl.innerHTML = `<div class="day-number">${date.getDate()}</div>`;
                    eventsForDay.forEach(e => {
                        const eventEl = document.createElement('div');
                        eventEl.className = 'event-item';
                        eventEl.textContent = `${e.time} ${e.title}`;
                        dayEl.appendChild(eventEl);
                    });

                    if (eventsForDay.length > 0) dayEl.classList.add('has-event');
                    if (dateStr === formatDate(selectedDate)) dayEl.classList.add('selected');

                    dayEl.onclick = () => selectDate(date);
                } else {
                    dayEl.style.opacity = '0.3';
                }

                cal.appendChild(dayEl);
                date.setDate(date.getDate() + 1);
            }

            updateDayEvents();
        }

        function selectDate(date) {
            selectedDate = new Date(date);
            renderCalendar();
        }

        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        function addEvent() {
            const title = document.getElementById('eventTitle').value;
            const time = document.getElementById('eventTime').value;

            if (!title) {
                showToast('Bitte Termin eingeben');
                return;
            }

            const event = {
                id: Date.now(),
                date: formatDate(selectedDate),
                title,
                time: time || '00:00'
            };

            appState.events.push(event);
            saveState();
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventTime').value = '';
            renderCalendar();
            showToast('Termin hinzugefügt ✓');
        }

        function updateDayEvents() {
            const dateStr = formatDate(selectedDate);
            const dayName = selectedDate.toLocaleDateString('de-DE', {weekday: 'long'});
            document.getElementById('selectedDateDisplay').textContent = `${dayName}, ${selectedDate.toLocaleDateString('de-DE')}`;

            const events = appState.events.filter(e => e.date === dateStr);
            const list = document.getElementById('eventsList');
            list.innerHTML = '';

            if (events.length === 0) {
                list.innerHTML = '<p style="color: #999; font-style: italic;">Keine Termine</p>';
                return;
            }

            events.forEach(e => {
                const el = document.createElement('div');
                el.className = 'item';
                el.innerHTML = `
                    <span class="item-text">${e.time} - ${e.title}</span>
                    <div class="item-actions">
                        <button class="btn-small btn-delete" onclick="deleteEvent(${e.id})">✕</button>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        function deleteEvent(id) {
            appState.events = appState.events.filter(e => e.id !== id);
            saveState();
            renderCalendar();
            showToast('Termin gelöscht');
        }

        // WEEK VIEW
        function getMonday(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function renderWeekEvents() {
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekEnd.getDate() + 6);

            document.getElementById('weekHeader').textContent =
                `${weekStart.toLocaleDateString('de-DE')} - ${weekEnd.toLocaleDateString('de-DE')}`;

            const weekView = document.getElementById('weekView');
            weekView.innerHTML = '';

            for (let i = 0; i < 7; i++) {
                const date = new Date(weekStart);
                date.setDate(date.getDate() + i);
                const dateStr = formatDate(date);
                const dayName = date.toLocaleDateString('de-DE', {weekday: 'long'});

                const dayEl = document.createElement('div');
                dayEl.className = 'week-day';
                dayEl.innerHTML = `<div class="week-day-header">${dayName}, ${date.toLocaleDateString('de-DE')}</div>`;

                const events = appState.events.filter(e => e.date === dateStr);
                if (events.length === 0) {
                    const noEvents = document.createElement('div');
                    noEvents.className = 'week-event no-events';
                    noEvents.textContent = 'Keine Termine';
                    dayEl.appendChild(noEvents);
                } else {
                    events.forEach(e => {
                        const eventEl = document.createElement('div');
                        eventEl.className = 'week-event';
                        eventEl.textContent = `${e.time} - ${e.title}`;
                        dayEl.appendChild(eventEl);
                    });
                }

                weekView.appendChild(dayEl);
            }
        }

        function prevWeek() {
            weekStart.setDate(weekStart.getDate() - 7);
            renderWeekEvents();
        }

        function nextWeek() {
            weekStart.setDate(weekStart.getDate() + 7);
            renderWeekEvents();
        }

        // NOTES
        function renderNotes() {
            const list = document.getElementById('notesList');
            list.innerHTML = '';

            if (appState.notes.length === 0) {
                list.innerHTML = '<p style="color: #999; font-style: italic; text-align: center;">Keine Notizen</p>';
                return;
            }

            appState.notes.forEach(note => {
                const el = document.createElement('div');
                el.className = `item ${note.done ? 'done' : ''}`;
                el.innerHTML = `
                    <input type="checkbox" class="checkbox" ${note.done ? 'checked' : ''} onchange="toggleNote(${note.id})">
                    <span class="item-text" onclick="editNote(${note.id})" style="cursor: pointer;">${note.text}</span>
                    <div class="item-actions">
                        <button class="btn-small btn-delete" onclick="deleteNote(${note.id})">✕</button>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        function addNote() {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();

            if (!text) {
                showToast('Bitte Notiz eingeben');
                return;
            }

            input.value = '';
            input.disabled = true;

            processNoteWithAI(text).then(processed => {
                const note = {
                    id: Date.now(),
                    text: processed || text,
                    done: false,
                    created: new Date().toISOString()
                };

                appState.notes.unshift(note);
                saveState();
                renderNotes();
                showToast('Notiz hinzugefügt ✓');
                input.disabled = false;
            }).catch(err => {
                console.error('Fehler bei AI-Verarbeitung:', err);
                const note = {
                    id: Date.now(),
                    text,
                    done: false,
                    created: new Date().toISOString()
                };
                appState.notes.unshift(note);
                saveState();
                renderNotes();
                showToast('Notiz hinzugefügt (ohne KI-Verarbeitung)');
                input.disabled = false;
            });
        }

        async function processNoteWithAI(text) {
            try {
                const response = await fetch(VERCEL_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text})
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data.processed || text;
            } catch (error) {
                console.error('AI-Verarbeitung fehlgeschlagen:', error);
                return text;
            }
        }

        function toggleNote(id) {
            const note = appState.notes.find(n => n.id === id);
            if (note) {
                note.done = !note.done;
                saveState();
                renderNotes();
            }
        }

        function editNote(id) {
            const note = appState.notes.find(n => n.id === id);
            if (note) {
                editingNoteId = id;
                document.getElementById('modalNoteText').value = note.text;
                document.getElementById('modal').classList.add('active');
            }
        }

        function saveModalNote() {
            const note = appState.notes.find(n => n.id === editingNoteId);
            if (note) {
                note.text = document.getElementById('modalNoteText').value;
                saveState();
                renderNotes();
                closeModal();
                showToast('Notiz aktualisiert ✓');
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            editingNoteId = null;
        }

        function deleteNote(id) {
            appState.notes = appState.notes.filter(n => n.id !== id);
            saveState();
            renderNotes();
            showToast('Notiz gelöscht');
        }

        // VOICE RECOGNITION
        function toggleVoice() {
            if (recognitionActive) {
                stopVoice();
            } else {
                startVoice();
            }
        }

        function startVoice() {
            recognitionActive = true;
            document.getElementById('voiceBtn').classList.add('recording');

            navigator.mediaDevices.getUserMedia({audio: true})
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = transcribe;
                    mediaRecorder.start();
                    showToast('🎤 Aufnahme läuft...');
                })
                .catch(err => {
                    console.error('Mikrofon-Fehler:', err);
                    showToast('❌ Mikrofon-Zugriff verweigert');
                    recognitionActive = false;
                    document.getElementById('voiceBtn').classList.remove('recording');
                });
        }

        function stopVoice() {
            if (mediaRecorder && recognitionActive) {
                mediaRecorder.stop();
                recognitionActive = false;
                document.getElementById('voiceBtn').classList.remove('recording');
                showToast('⏳ Transkribiere...');
            }
        }

        async function transcribe() {
            const audioBlob = new Blob(audioChunks, {type: 'audio/wav'});

            try {
                // Versuche AssemblyAI zuerst
                const formData = new FormData();
                formData.append('audio', audioBlob);

                const uploadRes = await fetch('https://api.assemblyai.com/v2/upload', {
                    method: 'POST',
                    headers: {'Authorization': ASSEMBLY_AI_TOKEN},
                    body: formData
                });

                if (!uploadRes.ok) throw new Error('AssemblyAI Upload fehlgeschlagen');

                const uploadData = await uploadRes.json();
                const audioUrl = uploadData.upload_url;

                const transcriptRes = await fetch('https://api.assemblyai.com/v2/transcript', {
                    method: 'POST',
                    headers: {
                        'Authorization': ASSEMBLY_AI_TOKEN,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({audio_url: audioUrl})
                });

                if (!transcriptRes.ok) throw new Error('Transkription fehlgeschlagen');

                let transcriptData = await transcriptRes.json();
                let pollCount = 0;
                const maxPolls = 30;

                while (transcriptData.status === 'processing' && pollCount < maxPolls) {
                    await new Promise(r => setTimeout(r, 2000));
                    const checkRes = await fetch(`https://api.assemblyai.com/v2/transcript/${transcriptData.id}`, {
                        headers: {'Authorization': ASSEMBLY_AI_TOKEN}
                    });
                    transcriptData = await checkRes.json();
                    pollCount++;
                }

                if (transcriptData.status === 'completed' && transcriptData.text) {
                    document.getElementById('noteInput').value = transcriptData.text;
                    showToast('✓ Transkription erfolgreich!');
                } else {
                    throw new Error('Transkription nicht abgeschlossen');
                }
            } catch (error) {
                console.warn('AssemblyAI fehlgeschlagen, verwende Web Speech API:', error);
                useWebSpeechFallback(audioBlob);
            }
        }

        function useWebSpeechFallback(audioBlob) {
            const reader = new FileReader();
            reader.onload = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    showToast('❌ Spracherkennung nicht unterstützt');
                    return;
                }

                const recognition = new SpeechRecognition();
                recognition.lang = 'de-DE';
                recognition.onresult = (event) => {
                    const transcript = Array.from(event.results)
                        .map(result => result[0].transcript)
                        .join('');
                    document.getElementById('noteInput').value = transcript;
                    showToast('✓ Web Speech OK');
                };
                recognition.onerror = (event) => {
                    console.error('Web Speech Fehler:', event.error);
                    showToast('❌ Spracherkennung fehlgeschlagen');
                };
                recognition.start();
            };
            reader.readAsArrayBuffer(audioBlob);
        }

        // UI
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));

            document.getElementById(tabName)?.classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'woche') renderWeekEvents();
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // EXPORT
        function exportJSON() {
            const data = JSON.stringify(appState, null, 2);
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `kalender-notizen-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            showToast('JSON exportiert ✓');
        }

        function exportCSV() {
            let csv = 'Typ,Datum,Zeit,Inhalt\n';

            appState.events.forEach(e => {
                csv += `Termin,"${e.date}","${e.time}","${e.title}"\n`;
            });

            appState.notes.forEach(n => {
                csv += `Notiz,"${n.created.split('T')[0]}","","${n.text.replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([csv], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `kalender-notizen-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            showToast('CSV exportiert ✓');
        }

        function resetAll() {
            if (confirm('⚠️ Wirklich alle Daten löschen? Das kann nicht rückgängig gemacht werden!')) {
                appState = {currentDate: new Date().toISOString().split('T')[0], selectedDate: new Date().toISOString().split('T')[0], weekStart: getMonday(new Date()).toISOString().split('T')[0], events: [], notes: []};
                localStorage.removeItem(STORAGE_KEY);
                renderCalendar();
                renderNotes();
                showToast('Alle Daten gelöscht ✓');
            }
        }

        // START
        init();
    </script>
</body>
</html>
